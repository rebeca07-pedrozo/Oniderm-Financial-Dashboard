<!-- ===== NUEVO (pulido) · este archivo se REEMPLAZA COMPLETO en Apps Script ===== -->
<style>
  :root {
    /* paleta Oniderm. El verde de la marca va en los datos (gráficos, barras, puntos);
       para texto y botones se usa su tono oscuro, que sí se lee (5,1:1 sobre blanco). */
    --verde: #4BB69E;
    --verde-tinta: #2B7A68;
    --verde-tinta-hover: #236457;
    --verde-claro: #8ECFBE;
    --verde-muy-claro: #E8F5F1;
    --verde-borde: #D5E8E2;
    --beige: #CDBFAF;
    --crema: #EDF1EF;        /* rellenos pequeños: pistas de barras, controles segmentados */
    --fondo: #F4F7F6;        /* fondo de la página, un paso hacia el verde más claro */
    --blanco: #FFFFFF;
    --texto: #3F403C;
    --texto-suave: #66665F;  /* gris que se lee: 5,8:1 sobre blanco */
    --alerta: #B9736B;       /* rojo de la marca, para datos */
    --alerta-tinta: #9C3D4C; /* rojo rosado oscuro para texto (6,6:1) */
    --control: #C9D6D1;      /* borde de campos y botones, un paso más fuerte que el de las tarjetas */
    --radio: 16px;
    --radio-control: 10px;

    /* alias que usan los formularios y las otras pestañas */
    --tarjeta: var(--blanco);
    --suave: var(--texto-suave);
    --borde: var(--verde-borde);
    --marca: var(--verde);
    --marca-claro: var(--verde-claro);
    --arena: var(--beige);
    --ingreso: var(--verde);
    --egreso: var(--beige);
    --ok: var(--verde-tinta);
    --error: var(--alerta-tinta);

    /* semáforo de logística (datos) */
    --amarillo: #D9A441;
    --rojo: var(--alerta);
    --vencido: #6B6560;
    --sin-dato: #C9C5BF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  button:focus-visible, a:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--verde-tinta); outline-offset: 2px;
  }

  /* ---------- marco: un solo ancho y un solo borde izquierdo para todas las pestañas ---------- */
  .app { max-width: 1120px; margin: 0 auto; padding: 24px 24px 64px; }

  /* En pantallas anchas, Ingreso y Egreso usan dos columnas: el formulario a la izquierda y,
     a la derecha, la búsqueda de pacientes, las facturas pendientes o lo recién guardado. */
  @media (min-width: 1000px) {
    .app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; column-gap: 24px; align-items: start; }
    .app > * { grid-column: 1 / -1; }
    #formIngreso, #formEgreso { grid-column: 1; grid-row: 3 / span 2; }
    #pacientesIngreso { grid-column: 2; grid-row: 3; margin-top: 0; }
    #recientes { grid-column: 2; grid-row: 4; }
    .app:has(#formEgreso:not(.oculto)) #recientes { grid-row: 3; margin-top: 0; }
    /* Egreso sin nada guardado todavía: el formulario usa todo el ancho */
    .app:has(#formEgreso:not(.oculto)):not(:has(#recientes:not(.oculto))) #formEgreso { grid-column: 1 / -1; }
    #formDash, #formLog, #formCierre { grid-column: 1 / -1; grid-row: 3; }
  }

  /* ---------- encabezado ---------- */
  .cabecera { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; }
  .marca { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .cabecera h1.logo { line-height: 0; }
  /* multiply funde el fondo blanco del logo con el fondo de la página */
  .marca img { height: 46px; width: auto; max-width: 100%; mix-blend-mode: multiply; }
  .cabecera h1 { margin: 0; font-size: 22px; font-weight: 600; color: var(--verde-tinta); letter-spacing: -0.02em; }
  .cabecera p { margin: 0; font-size: 13px; color: var(--texto-suave); }
  .estado { font-size: 13px; color: var(--texto-suave); text-align: right; }

  /* ---------- pestañas: subrayado sobre una línea, en una sola fila ---------- */
  .tabs {
    display: flex; gap: 28px; margin-bottom: 24px; border-bottom: 1px solid var(--verde-borde);
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; display: inline-flex; align-items: center; gap: 7px;
    padding: 14px 2px 12px; margin-bottom: -1px; border: 0; border-bottom: 2px solid transparent;
    background: none; font: inherit; font-size: 15px; font-weight: 500; color: var(--texto-suave);
    cursor: pointer; white-space: nowrap;
  }
  .tab:hover { color: var(--texto); }
  .tab.activa { color: var(--texto); font-weight: 600; border-bottom-color: var(--verde-tinta); }

  /* ---------- formularios ---------- */
  .tarjeta { background: var(--blanco); border: 1px solid var(--verde-borde); border-radius: var(--radio); padding: 24px; }

  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px 14px; }
  .campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; grid-column: span 12; }
  .campo.chico { grid-column: span 3; }
  .campo.medio { grid-column: span 4; }
  .campo.grande { grid-column: span 6; }
  .campo.total { grid-column: span 12; }
  .campo.oculto { display: none; }
  /* filas que suman 12 columnas, sin huecos */
  #formIngreso .campo:has(#i_codigo) { grid-column: span 9; }
  #formIngreso .campo:has(#i_cantidad) { grid-column: span 2; }
  #formIngreso .campo:has(#i_factura) { grid-column: span 3; }
  #formIngreso .campo:has(#i_numFactura) { grid-column: span 3; }
  #formIngreso .campo.total { grid-column: span 7; }
  #formIngreso:has(#cajaNumFactura:not(.oculto)) .campo.total { grid-column: span 4; }
  #formEgreso .campo:has(#e_concepto) { grid-column: span 4; }
  #formEgreso .campo:has(#e_descripcion) { grid-column: span 5; }
  #formEgreso .campo:has(#e_valor), #formEgreso .campo:has(#e_soporte),
  #formEgreso .campo:has(#e_numSoporte), #formEgreso .campo:has(#e_cantidad) { grid-column: span 3; }

  .campo > span { font-size: 13.5px; font-weight: 500; color: var(--texto); }
  .campo em { font-weight: 400; font-style: normal; color: var(--texto-suave); }

  input, select {
    font: inherit; height: 42px; padding: 0 12px; border: 1px solid var(--control);
    border-radius: var(--radio-control); background: var(--blanco); color: var(--texto); width: 100%;
  }
  input::placeholder { color: #8A8A84; }
  input:hover, select:hover { border-color: #AFC2BB; }
  input:focus, select:focus { outline: none; border-color: var(--verde-tinta); box-shadow: 0 0 0 3px rgba(75, 182, 158, 0.22); } /* anillo de foco, no sombra (taste-skill-ignore) */

  .pista { font-size: 12.5px; line-height: 16px; color: var(--verde-tinta); min-height: 16px; font-weight: 500; margin-top: -2px; }

  .resumen { display: flex; gap: 10px; margin: 22px 0 18px; padding: 16px 18px; background: var(--verde-muy-claro); border-radius: 12px; }
  .resumen div { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .resumen span { font-size: 13px; color: var(--texto-suave); }
  .resumen strong { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .resumen .neto strong { color: var(--verde-tinta); }

  .guardar {
    width: 100%; height: 48px; margin-top: 4px; border: 0; border-radius: var(--radio-control);
    background: var(--verde-tinta); color: #fff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .guardar:hover { background: var(--verde-tinta-hover); }
  .guardar.gasto { margin-top: 22px; }
  .guardar:disabled { opacity: 0.6; cursor: wait; }

  .recientes { margin-top: 16px; }
  .recientes h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
  .recientes ul { list-style: none; margin: 0; padding: 0; background: var(--blanco); border: 1px solid var(--verde-borde); border-radius: var(--radio); }
  .recientes li { display: flex; justify-content: space-between; gap: 10px; padding: 12px 16px; font-size: 14px; border-bottom: 1px solid #EEF2F0; }
  .recientes li:last-child { border-bottom: 0; }
  .recientes b { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }

  .aviso {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 90px);
    padding: 12px 18px; border-radius: 12px; color: #fff; font-size: 14px;
    background: var(--verde-tinta); opacity: 0; transition: transform 0.25s, opacity 0.25s; max-width: 90%;
    box-shadow: 0 8px 24px rgba(30, 50, 45, 0.18); /* flota sobre la página (taste-skill-ignore) */
  }
  .aviso.visible { transform: translate(-50%, 0); opacity: 1; }
  .aviso.malo { background: var(--alerta-tinta); }

  .oculto { display: none; }

  /* ---------- títulos de cada pestaña ---------- */
  .tablero-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px 20px; flex-wrap: wrap; margin-bottom: 20px; }
  .titulo-tablero { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; }
  .sub-tablero { margin: 2px 0 0; font-size: 14px; color: var(--texto-suave); }

  .periodo { display: flex; gap: 8px; align-items: center; }
  .periodo select { width: auto; height: 38px; font-size: 14px; padding: 0 12px; cursor: pointer; }
  .recargar {
    font-size: 16px; width: 38px; height: 38px; line-height: 1; flex: none;
    border: 1px solid var(--control); border-radius: var(--radio-control);
    background: var(--blanco); color: var(--texto-suave); cursor: pointer;
  }
  .recargar:hover { color: var(--verde-tinta); border-color: var(--verde-tinta); }

  /* ---------- dashboard ---------- */
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi {
    min-width: 0; background: var(--blanco); border: 1px solid var(--verde-borde); border-radius: var(--radio);
    padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 6px;
  }
  .kpi.destacada { background: var(--verde-muy-claro); border-color: var(--verde-claro); }
  .kpi-nombre { font-size: 13px; color: var(--texto-suave); line-height: 1.3; }
  .kpi strong { font-size: clamp(19px, 1.8vw, 25px); white-space: nowrap; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .kpi-cambio { font-style: normal; font-size: 12.5px; color: var(--texto-suave); }
  .kpi-cambio.sube { color: var(--verde-tinta); }
  .kpi-cambio.baja { color: var(--alerta-tinta); }

  /* avisos para revisar: una nota ámbar pálida, sin barra lateral */
  .revisar {
    background: #FFFBF0; border: 1px solid #EFDFB5; border-radius: var(--radio); padding: 18px 22px; margin-bottom: 16px;
  }
  .revisar h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
  .revisar ul { margin: 0; padding-left: 18px; }
  .revisar li { font-size: 14px; margin-bottom: 5px; }
  .revisar li:last-child { margin-bottom: 0; }
  .revisar li span { color: var(--texto-suave); }

  .panel {
    background: var(--blanco); border: 1px solid var(--verde-borde); border-radius: var(--radio);
    padding: 22px 24px 20px; margin-bottom: 16px;
  }
  .panel h2 { margin: 0 0 18px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .dos-paneles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .dos-paneles > * { min-width: 0; } /* si no, el canvas del gráfico no deja encoger la columna */
  .lienzo { position: relative; height: 240px; }
  .lienzo.alto { height: 300px; }
  .lectura { margin: 16px 0 0; padding-top: 14px; border-top: 1px solid #EEF2F0; font-size: 14px; color: var(--texto-suave); }
  .lectura b { color: var(--texto); font-weight: 600; }

  .tabla { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tabla th { text-align: right; padding: 10px 12px; border-bottom: 1px solid var(--verde-borde); font-size: 12.5px; font-weight: 500; color: var(--texto-suave); }
  .tabla th:first-child, .tabla td:first-child { text-align: left; }
  .tabla td { text-align: right; padding: 11px 12px; border-bottom: 1px solid #EEF2F0; font-variant-numeric: tabular-nums; }
  .tabla tbody tr:last-child td { border-bottom: 0; }
  .tabla tbody tr:hover { background: #F6FAF8; }
  .negativo { color: var(--alerta-tinta); }

  /* ---------- botones ---------- */
  .boton-registrar {
    height: 40px; padding: 0 18px; border: 0; border-radius: var(--radio-control); background: var(--verde-tinta); color: #fff;
    font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .boton-registrar:hover { background: var(--verde-tinta-hover); }
  .boton-registrar:disabled { opacity: 0.6; cursor: wait; }
  .boton-registrar[aria-expanded="true"] { background: var(--blanco); color: var(--texto); border: 1px solid var(--control); }

  .boton-chico {
    height: 32px; padding: 0 11px; border: 1px solid var(--control); border-radius: 8px; background: var(--blanco);
    font: inherit; font-size: 13px; font-weight: 500; color: var(--texto); cursor: pointer; white-space: nowrap;
  }
  .boton-chico:hover { border-color: var(--verde-tinta); color: var(--verde-tinta); }
  .boton-chico.primario { background: var(--verde-tinta); border-color: var(--verde-tinta); color: #fff; }
  .boton-chico.primario:hover { background: var(--verde-tinta-hover); color: #fff; }
  .boton-chico.suave { border-color: transparent; background: transparent; color: var(--texto-suave); }
  .boton-chico.suave:hover { color: var(--texto); }
  .boton-chico:disabled { opacity: 0.6; cursor: wait; }

  .enlace { border: 0; background: none; padding: 0; font: inherit; color: var(--verde-tinta); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

  /* ---------- logística ---------- */
  .contador {
    display: inline-block; padding: 0 7px; border-radius: 10px;
    background: #F6E7E5; color: var(--alerta-tinta); font-size: 12px; font-weight: 600; line-height: 20px;
  }
  .contador.oculto { display: none; }

  .form-insumo { margin-bottom: 16px; }
  .seg { display: inline-flex; padding: 3px; background: var(--crema); border-radius: 12px; margin-bottom: 20px; }
  .seg-op {
    height: 36px; padding: 0 18px; border: 0; border-radius: 9px; background: transparent;
    font: inherit; font-size: 14px; font-weight: 500; color: var(--texto-suave); cursor: pointer;
  }
  .seg-op.activa { background: var(--blanco); color: var(--texto); box-shadow: 0 1px 2px rgba(40, 60, 55, 0.12); } /* opción elegida del control (taste-skill-ignore) */

  .fila-vence { display: flex; gap: 10px; align-items: center; }
  .fila-vence input[type="date"] { flex: 1; }
  .casilla { display: flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; cursor: pointer; }
  .casilla input { width: auto; height: auto; }
  .pista.estado-VENCIDO { color: var(--vencido); }
  .pista.estado-ROJO { color: var(--alerta-tinta); }
  .pista.estado-AMARILLO { color: #8A6416; }
  .pista.estado-VERDE { color: var(--verde-tinta); }
  .pista.estado-NO_APLICA, .pista.estado-SIN_FECHA { color: var(--texto-suave); }

  .mas-detalles { margin-top: 18px; border-top: 1px solid #EEF2F0; padding-top: 14px; }
  .mas-detalles summary { cursor: pointer; font-size: 14px; font-weight: 500; color: var(--texto); margin-bottom: 12px; }
  .mas-detalles summary em { font-weight: 400; font-style: normal; color: var(--texto-suave); }

  .duplicado { margin-top: 16px; padding: 14px 16px; background: #FFFBF0; border: 1px solid #EFDFB5; border-radius: 12px; }
  .duplicado p { margin: 0 0 10px; font-size: 14px; }
  .acciones-dup, .acciones-form { display: flex; gap: 8px; flex-wrap: wrap; }
  .acciones-form { margin-top: 20px; align-items: center; }
  .acciones-form .guardar { flex: 1; margin: 0; }

  .filtros-log { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .filtros-log select { width: auto; height: 38px; font-size: 14px; padding: 0 12px; }
  .filtros-log input[type="search"] { flex: 1; min-width: 260px; height: 38px; font-size: 14px; padding: 0 12px; }
  .cargando { color: var(--texto-suave); font-size: 14px; }

  .kpis.seis { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .kpi-estado { cursor: pointer; }
  .kpi-estado:hover, .kpi-estado.elegida { border-color: var(--verde-tinta); }
  .kpi-estado.elegida { box-shadow: inset 0 0 0 1px var(--verde-tinta); } /* borde doble del filtro elegido (taste-skill-ignore) */
  .kpi-cambio.enlace { color: var(--verde-tinta); }

  .punto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; flex: none; }
  .punto.vencido { background: var(--vencido); }
  .punto.rojo { background: var(--rojo); }
  .punto.amarillo { background: var(--amarillo); }
  .punto.verde { background: var(--verde); }
  .punto.sin-dato { background: var(--sin-dato); }

  .conteo-tabla { font-weight: 400; color: var(--texto-suave); font-size: 13px; margin-left: 6px; }
  .tabla-scroll { overflow-x: auto; }
  .tabla.inventario { font-size: 13.5px; }
  .tabla.inventario td, .tabla.inventario th { text-align: left; white-space: nowrap; padding-left: 8px; padding-right: 8px; vertical-align: middle; }
  .tabla.inventario td.producto { white-space: normal; min-width: 170px; }
  .tabla.inventario td.lote { font-size: 13px; }
  .tabla.inventario .num { text-align: right; }
  .tabla.inventario tr.vencida td { background: #F7F5F2; }
  .tabla.inventario tr.inactiva td { color: var(--texto-suave); }
  .tabla.inventario .suave { color: var(--texto-suave); font-size: 12.5px; }
  .etiqueta { display: inline-block; padding: 1px 7px; border-radius: 6px; background: var(--crema); font-size: 12px; font-weight: 600; color: var(--texto-suave); }
  .estado-celda { display: inline-flex; align-items: center; }
  .acciones-fila { display: flex; flex-wrap: wrap; gap: 4px; max-width: 190px; }
  .acciones-fila .boton-chico { height: 30px; padding: 0 9px; font-size: 12.5px; }
  .editor-fila td { background: var(--verde-muy-claro) !important; white-space: normal !important; }
  .editor { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 4px 0; }
  .editor input[type="date"], .editor input[type="number"], .editor input[type="text"] { width: auto; height: 36px; padding: 0 10px; font-size: 14px; }
  .editor input[type="text"] { min-width: 220px; }
  .ver-mas { margin-top: 12px; }

  /* ---------- pacientes (columna derecha de Ingreso) ---------- */
  #pacientesIngreso { display: flex; flex-direction: column; gap: 16px; }
  #pacientesIngreso.oculto { display: none; }
  .bloque-pacientes { padding: 20px; }
  .bloque-pacientes h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; letter-spacing: -0.01em; }
  .buscador { display: flex; gap: 8px; }
  .buscador input { flex: 1; min-width: 0; }
  .buscador .boton-chico { height: 42px; padding: 0 16px; font-size: 14px; }
  .estado-lista { margin: 10px 0 0; font-size: 13px; color: var(--texto-suave); }
  .estado-lista:empty { display: none; }
  .lista-ingresos { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .lista-ingresos:empty { display: none; }
  .item-ingreso { border: 1px solid var(--verde-borde); border-radius: 12px; background: var(--blanco); overflow: hidden; }
  .item-ingreso.abierto { border-color: var(--verde-claro); }
  .item-cabeza {
    width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center;
    padding: 11px 14px; border: 0; background: transparent; font: inherit; text-align: left; cursor: pointer; color: var(--texto);
  }
  .item-cabeza:hover { background: #F6FAF8; }
  .item-nombre { font-weight: 600; font-size: 14px; }
  .item-cc { font-weight: 400; font-size: 12.5px; color: var(--texto-suave); margin-left: 4px; white-space: nowrap; }
  .item-meta { grid-column: 1; font-size: 13px; color: var(--texto-suave); }
  .etiqueta-factura { grid-row: 1 / span 2; grid-column: 2; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 8px; background: var(--crema); color: var(--texto-suave); white-space: nowrap; }
  .etiqueta-factura.pendiente { background: #FBF0D9; color: #8A6416; }
  .etiqueta-factura.lista { background: var(--verde-muy-claro); color: var(--verde-tinta); }
  /* en la lista de pendientes todos están "sin número": la etiqueta sobra */
